name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      chrome_version:
        description: "Chrome for Testing version (empty: the current Stable)"
        required: false

permissions:
  contents: write

jobs:
  build:
    # The oldest supported runner: the AppImage runs on systems with this
    # glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's xcb and Wayland plugins need these at freeze time, so that
      # PyInstaller bundles the ones not every desktop has (xcb-cursor, ...).
      - name: Libraries for the bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxcb-shape0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            binutils zsync

      - name: Build
        id: build
        env:
          CHROME_VERSION: ${{ inputs.chrome_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build-appimage.sh
          echo "chrome=$(cat build/AppDir/opt/chrome/CHROME_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Chatter-AppImage
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: "Bundles Chrome for Testing ${{ steps.build.outputs.chrome }}."
          generate_release_notes: true
