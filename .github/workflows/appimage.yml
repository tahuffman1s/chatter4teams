name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand with a version to release it: the release and its tag
  # v<version> are made here, on the commit the run is for.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. 0.1.0 (empty: just build)"
        required: false

permissions:
  contents: write

jobs:
  build:
    # The oldest supported runner: the AppImage runs on systems with this
    # glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # (npm: Dart Sass, for the adw-gtk3 theme)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Qt's xcb and Wayland plugins need these at freeze time, so that
      # PyInstaller bundles the ones not every desktop has (xcb-cursor, ...).
      - name: Libraries for the bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxcb-shape0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            binutils zsync

      - name: Build
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$RELEASE" ]]; then export VERSION="${RELEASE#v}"; fi
          ./build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chatter-AppImage
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release) }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
